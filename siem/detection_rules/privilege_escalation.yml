title: Privilege Escalation Indicators
id: aisoc-ep-002
status: experimental
description: Local admin group modification, privilege enumeration, credential dumping strings (rule EP-002)
tags: [attack.privilege_escalation, attack.t1098, attack.t1003]
logsource: {product: windows, category: process_creation}
detection:
  selection:
    CommandLine|contains: ['localgroup administrators', 'whoami /priv', 'sekurlsa', 'mimikatz']
  condition: selection
level: critical
