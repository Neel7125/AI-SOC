title: Suspicious File Activity / Ransomware Precursor
id: aisoc-ep-003
status: experimental
description: Executables in Temp, shadow copy deletion, ransomware extensions (rule EP-003)
tags: [attack.impact, attack.t1490, attack.t1486]
logsource: {product: windows, category: file_event}
detection:
  selection_file: {TargetFilename|endswith: ['.locked']}
  selection_vss: {CommandLine|contains: 'vssadmin delete shadows'}
  condition: selection_file or selection_vss
level: high
